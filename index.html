<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penguin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030406;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #penguinSource {
      display: none;
    }
  </style>
</head>
<body>
  <img id="penguinSource" src="./IMG_4593.jpeg" alt="" />
  <canvas id="scene"></canvas>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const img = document.getElementById('penguinSource');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const dustParticles = Array.from({ length: 85 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 1.6 + 0.4,
      speedX: -(Math.random() * 0.6 + 0.2),
      speedY: (Math.random() - 0.5) * 0.25,
      alpha: Math.random() * 0.35 + 0.08
    }));

    const hourglass = {
      cycleDuration: 11000,
      flipDuration: 1200,
      grains: Array.from({ length: 45 }, (_, i) => ({
        offset: i / 45,
        xJitter: (Math.random() - 0.5) * 2.2
      }))
    };

    let processedPenguinCanvas = null;
    let imageLoaded = false;

    function preparePenguinSprite() {
      const off = document.createElement('canvas');
      const octx = off.getContext('2d');
      off.width = img.naturalWidth || 800;
      off.height = img.naturalHeight || 800;
      octx.drawImage(img, 0, 0, off.width, off.height);

      try {
        const imgData = octx.getImageData(0, 0, off.width, off.height);
        const data = imgData.data;

        const visited = new Uint8Array(off.width * off.height);
        const stack = [];

        function isDarkBg(idx) {
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          return r < 24 && g < 24 && b < 24;
        }

        for (let x = 0; x < off.width; x++) {
          stack.push(x, (off.height - 1) * off.width + x);
        }
        for (let y = 0; y < off.height; y++) {
          stack.push(y * off.width, y * off.width + (off.width - 1));
        }

        while (stack.length > 0) {
          const pos = stack.pop();
          if (visited[pos]) continue;
          visited[pos] = 1;

          const idx = pos * 4;
          if (isDarkBg(idx)) {
            data[idx + 3] = 0;
            const x = pos % off.width;
            const y = (pos / off.width) | 0;
            if (x > 0) stack.push(pos - 1);
            if (x < off.width - 1) stack.push(pos + 1);
