<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penguin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth || 390;
    let height = canvas.height = window.innerHeight || 844;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth || 390;
      height = canvas.height = window.innerHeight || 844;
    });

    function pad2(num) {
      return String(num).padStart(2, '0');
    }

    // رسم الصفحة والطريق بالكامل باللون الأسود الصافي مع ضوء خفيف باتجاه ظهر البطريق
    function drawPureBlackRoadWithBacklight(time) {
      // خلفية سوداء بالكامل
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      const horizonY = height * 0.45;
      const centerX = width * 0.5;
      const penguinBackY = height * 0.62;

      // ضوء خفيف جداً موجه نحو ظهر البطريق
      const backSpotlight = ctx.createRadialGradient(
        centerX, penguinBackY, 8,
        centerX, penguinBackY, Math.min(width, height) * 0.44
      );
      backSpotlight.addColorStop(0, 'rgba(215, 225, 245, 0.16)');
      backSpotlight.addColorStop(0.45, 'rgba(165, 180, 210, 0.06)');
      backSpotlight.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = backSpotlight;
      ctx.fillRect(0, 0, width, height);

      // الطريق الأسود الطويل
      const roadTopWidth = Math.max(10, width * 0.02);
      const roadBottomWidth = width * 0.96;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(centerX - roadTopWidth * 0.5, horizonY);
      ctx.lineTo(centerX + roadTopWidth * 0.5, horizonY);
      ctx.lineTo(centerX + roadBottomWidth * 0.5, height);
      ctx.lineTo(centerX - roadBottomWidth * 0.5, height);
      ctx.closePath();

      ctx.fillStyle = '#020203';
      ctx.fill();

      // حواف الطريق الخافتة جداً في الظلام
      const edgeGrad = ctx.createLinearGradient(0, horizonY, 0, height);
      edgeGrad.addColorStop(0, 'rgba(255, 255, 255, 0.02)');
      edgeGrad.addColorStop(0.55, 'rgba(210, 220, 240, 0.14)');
      edgeGrad.addColorStop(1, 'rgba(255, 255, 255, 0.03)');
      ctx.strokeStyle = edgeGrad;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // خطوط حركة خافتة جداً على الطريق الأسود لإظهار المشي للأمام
      ctx.clip();
      const speed = (time * 0.045) % 100;
      for (let i = 0; i < 16; i++) {
        const raw = ((i * 100 + speed) / 1600);
        const p = Math.pow(raw, 2.2);
        if (p <= 0 || p > 1.05) continue;

        const y = horizonY + p * (height - horizonY);
        const halfSpan = (roadTopWidth * 0.5) + (roadBottomWidth - roadTopWidth) * 0.5 * p;

        ctx.strokeStyle = `rgba(200, 210, 230, ${0.015 + p * 0.035})`;
        ctx.lineWidth = 0.8 + p * 1.1;
        ctx.beginPath();
        ctx.moveTo(centerX - halfSpan, y);
        ctx.lineTo(centerX + halfSpan, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // رسم البطريق من الخلف بالأسود الصافي بدون أي نقاط أو أوساخ، مع تاج ذهبي وأحجار كريمة بنفسجية
    function drawCleanBlackPenguinFromBack(time) {
      const centerX = width * 0.5;
      const groundY = height * 0.74;

      const stepPhase = time * 0.0042;
      const waddleAngle = Math.sin(stepPhase) * 0.06;
      const bodyBounce = Math.abs(Math.sin(stepPhase)) * 5.5;

      const leftStep = Math.sin(stepPhase);
      const rightStep = -Math.sin(stepPhase);

      const scale = Math.max(0.75, Math.min(width, height) / 760);
      const bodyW = 94 * scale;
      const bodyH = 166 * scale;

      // انعكاس الضوء الخفيف على الأرض خلف البطريق
      const floorLight = ctx.createRadialGradient(
        centerX, groundY + 4, 4,
        centerX, groundY + 4, bodyW * 1.4
      );
      floorLight.addColorStop(0, 'rgba(210, 220, 240, 0.14)');
      floorLight.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = floorLight;
      ctx.beginPath();
      ctx.ellipse(centerX, groundY + 4, bodyW * 1.3, 20 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // --- القدمان الصغيرتان المتناسقتان ---
      function drawSmallFoot(offsetX, stepVal) {
        const lift = Math.max(0, stepVal) * 6.5;
        const forwardShift = stepVal * 4.5;
        const footY = groundY - lift - forwardShift * 0.35;
        const footScale = 1 - forwardShift * 0.014;

        ctx.save();
        ctx.translate(centerX + offsetX, footY);
        ctx.scale(footScale, footScale);

        ctx.fillStyle = '#121316';
        ctx.strokeStyle = 'rgba(210, 218, 232, 0.45)';
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(-10 * scale, 2);
        ctx.quadraticCurveTo(-12 * scale, -7 * scale, -5 * scale, -9 * scale);
        ctx.quadraticCurveTo(0, -10.5 * scale, 5 * scale, -9 * scale);
        ctx.quadraticCurveTo(12 * scale, -7 * scale, 10 * scale, 2);
        ctx.quadraticCurveTo(0, 4.5 * scale, -10 * scale, 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      }

      drawSmallFoot(-bodyW * 0.24, leftStep);
      drawSmallFoot(bodyW * 0.24, rightStep);

      // --- جسم البطريق الأسود الصافي بالكامل من الخلف ---
      ctx.save();
      ctx.translate(centerX, groundY - bodyBounce);
      ctx.rotate(waddleAngle);

      const leftWingAngle = -0.16 + Math.sin(stepPhase) * 0.07;
      const rightWingAngle = 0.16 + Math.sin(stepPhase) * 0.07;

      // الجناح الأيسر
      ctx.save();
      ctx.translate(-bodyW * 0.45, -bodyH * 0.56);
      ctx.rotate(leftWingAngle);
      ctx.fillStyle = '#050507';
      ctx.strokeStyle = 'rgba(220, 228, 242, 0.38)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(-6 * scale, 26 * scale, 8.5 * scale, 34 * scale, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // الجناح الأيمن
      ctx.save();
      ctx.translate(bodyW * 0.45, -bodyH * 0.56);
      ctx.rotate(rightWingAngle);
      ctx.fillStyle = '#050507';
      ctx.strokeStyle = 'rgba(220, 228, 242, 0.38)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(6 * scale, 26 * scale, 8.5 * scale, 34 * scale, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // الظهر الأسود الصافي الناعم بدون أي شوائب أو نقاط
      const cleanBackGrad = ctx.createLinearGradient(-bodyW * 0.5, 0, bodyW * 0.5, 0);
      cleanBackGrad.addColorStop(0, '#1e222b');
      cleanBackGrad.addColorStop(0.16, '#08090c');
      cleanBackGrad.addColorStop(0.5, '#030304');
      cleanBackGrad.addColorStop(0.84, '#08090c');
      cleanBackGrad.addColorStop(1, '#1e222b');

      ctx.fillStyle = cleanBackGrad;
      ctx.beginPath();
      ctx.moveTo(-bodyW * 0.44, -bodyH * 0.76);
      ctx.bezierCurveTo(-bodyW * 0.54, -bodyH * 0.4, -bodyW * 0.52, -bodyH * 0.06, -bodyW * 0.34, -2);
      ctx.quadraticCurveTo(0, 4, bodyW * 0.34, -2);
      ctx.bezierCurveTo(bodyW * 0.52, -bodyH * 0.06, bodyW * 0.54, -bodyH * 0.4, bodyW * 0.44, -bodyH * 0.76);
      ctx.closePath();
      ctx.fill();

      // إضاءة خفيفة ناعمة على حافة الظهر نتيجة الضوء المسلط عليه
      ctx.strokeStyle = 'rgba(220, 228, 245, 0.42)';
      ctx.lineWidth = 1.3;
      ctx.stroke();

      // ذيل البطريق الأسود الصافي الصغير
      ctx.fillStyle = '#060709';
      ctx.strokeStyle = 'rgba(200, 210, 228, 0.32)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-9 * scale, -9 * scale);
      ctx.lineTo(0, 2 * scale);
      ctx.lineTo(9 * scale, -9 * scale);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // --- التاج الذهبي الفاخر مع أحجار كريمة بنفسجية ---
      const crownBaseY = -bodyH * 0.75;
      const crownW = bodyW * 0.46;
      const crownH = bodyH * 0.34;

      const goldGrad = ctx.createLinearGradient(-crownW, crownBaseY, crownW, crownBaseY);
      goldGrad.addColorStop(0, '#b8860b');
      goldGrad.addColorStop(0.22, '#ffd700');
      goldGrad.addColorStop(0.5, '#d4af37');
      goldGrad.addColorStop(0.78, '#ffdf4d');
      goldGrad.addColorStop(1, '#996515');

      ctx.fillStyle = goldGrad;
      ctx.strokeStyle = '#fff2a6';
      ctx.lineWidth = 1.4;

      ctx.beginPath();
      ctx.moveTo(-crownW, crownBaseY);
      ctx.lineTo(-crownW * 0.85, crownBaseY - crownH * 0.72);
      ctx.lineTo(-crownW * 0.42, crownBaseY - crownH * 0.36);
      ctx.lineTo(0, crownBaseY - crownH);
      ctx.lineTo(crownW * 0.42, crownBaseY - crownH * 0.36);
      ctx.lineTo(crownW * 0.85, crownBaseY - crownH * 0.72);
      ctx.lineTo(crownW, crownBaseY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // قاعدة التاج الذهبية
      ctx.fillStyle = '#c59b27';
      ctx.fillRect(-crownW, crownBaseY - 4 * scale, crownW * 2, 4 * scale);

      // دالة رسم حجر كريم بنفسجي متلألئ
      function drawPurpleGem(gx, gy, gw, gh) {
        ctx.save();
        ctx.translate(gx, gy);

        // توهج بنفسجي خفيف حول الحجر الكريم
        const gemGlow = ctx.createRadialGradient(0, 0, 1, 0, 0, gh * 1.4);
        gemGlow.addColorStop(0, 'rgba(186, 85, 255, 0.65)');
        gemGlow.addColorStop(1, 'rgba(120, 30, 200, 0)');
        ctx.fillStyle = gemGlow;
        ctx.beginPath();
        ctx.arc(0, 0, gh * 1.4, 0, Math.PI * 2);
        ctx.fill();

        const gemGrad = ctx.createLinearGradient(-gw, -gh, gw, gh);
        gemGrad.addColorStop(0, '#e0aaff');
        gemGrad.addColorStop(0.45, '#9d4edd');
        gemGrad.addColorStop(1, '#3c096c');

        ctx.fillStyle = gemGrad;
        ctx.strokeStyle = '#f3d5ff';
        ctx.lineWidth = 0.9;

        ctx.beginPath();
        ctx.moveTo(0, -gh);
        ctx.lineTo(gw, 0);
        ctx.lineTo(0, gh);
        ctx.lineTo(-gw, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // لمعة داخل الحجر البنفسجي
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.beginPath();
        ctx.arc(-gw * 0.25, -gh * 0.25, 1.3 * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // ثلاث أحجار كريمة بنفسجية على التاج الذهبي (وسط ويمين ويسار)
      drawPurpleGem(0, crownBaseY - crownH * 0.28, 6.5 * scale, 9.5 * scale);
      drawPurpleGem(-crownW * 0.56, crownBaseY - crownH * 0.22, 4.5 * scale, 6.5 * scale);
      drawPurpleGem(crownW * 0.56, crownBaseY - crownH * 0.22, 4.5 * scale, 6.5 * scale);

      ctx.restore();
    }

    // رسم عداد الوقت الحي: السنة، الأيام، الساعات، الدقائق، الثواني بتصميم أنيق ومتناسق في الظلام
    function drawFullTimeCounter() {
      const now = new Date();
      const year = now.getFullYear();

      // حساب رقم اليوم في السنة الحالية
      const startOfYear = new Date(year, 0, 1);
      const diffMs = now - startOfYear;
      const dayOfYear = Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1;

      const hours = pad2(now.getHours());
      const minutes = pad2(now.getMinutes());
      const seconds = pad2(now.getSeconds());

      const cx = width * 0.5;
      const topY = Math.max(72, height * 0.12);

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // عرض الساعة : الدقيقة : الثانية بوضوح وأناقة
      const mainFontSize = Math.min(34, Math.max(22, width * 0.065));
      ctx.font = `300 ${mainFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace`;
      ctx.fillStyle = 'rgba(240, 244, 252, 0.9)';
      ctx.shadowColor = 'rgba(200, 215, 245, 0.28)';
      ctx.shadowBlur = 12;
      ctx.fillText(`${hours} : ${minutes} : ${seconds}`, cx, topY);

      // خط فاصل خافت
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - 75, topY + mainFontSize * 0.72);
      ctx.lineTo(cx + 75, topY + mainFontSize * 0.72);
      ctx.stroke();

      // عرض الأيام والسنة أسفل الساعة مباشرة
      const subFontSize = Math.min(15, Math.max(12, width * 0.032));
      ctx.font = `400 ${subFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace`;
      ctx.fillStyle = 'rgba(195, 205, 225, 0.68)';
      ctx.fillText(`${year}  •  ${String(dayOfYear).padStart(3, '0')}D`, cx, topY + mainFontSize * 1.32);

      ctx.restore();
    }

    function animate(time) {
      const t = typeof time === 'number' ? time : performance.now();
      drawPureBlackRoadWithBacklight(t);
      drawCleanBlackPenguinFromBack(t);
      drawFullTimeCounter();
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
