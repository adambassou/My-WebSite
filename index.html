  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #sound-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 11px 24px;
      background: #c80014;
      color: #ffffff;
      border: 2px solid #ff3b4e;
      border-radius: 999px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      z-index: 30;
      box-shadow: 0 0 22px rgba(255, 0, 30, 0.85);
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    #sound-btn:hover {
      background: #e60017;
      box-shadow: 0 0 28px rgba(255, 25, 45, 1);
    }

    #sound-btn:active {
      transform: translateX(-50%) scale(0.94);
      background: #99000f;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <button id="sound-btn" type="button">click here</button>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const soundBtn = document.getElementById('sound-btn');

    let width = canvas.width = window.innerWidth || 390;
    let height = canvas.height = window.innerHeight || 844;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth || 390;
      height = canvas.height = window.innerHeight || 844;
    });

    function pad2(num) {
      return String(num).padStart(2, '0');
    }

    // --- Web Audio & Vibration Horror Engine (1 Minute Full Duration) ---
    const HORROR_DURATION_MS = 60000; // 1 minute
    const HORROR_DURATION_SEC = 60;   // 1 minute

    let audioCtx = null;
    let audioUnlocked = false;
    let pendingHorrorSound = false;
    let horrorFlashUntil = 0;
    let activeSoundStopTimer = null;

    // Trigger ghost 5 seconds after entering the page
    const pageEnterTime = performance.now();
    let entryGhostTriggered = false;

    function triggerHorrorVibration() {
      try {
        if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
          navigator.vibrate([240, 70, 280, 70, 380, 80, 320, 80, 420]);
        }
      } catch (_) {}
    }

    function makeDistortionCurve(amount = 160) {
      const nSamples = 44100;
      const curve = new Float32Array(nSamples);
      const deg = Math.PI / 180;
      for (let i = 0; i < nSamples; i++) {
        const x = (i * 2) / nSamples - 1;
        curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
      }
      return curve;
    }

    function stopCurrentHorrorSound() {
      if (activeSoundStopTimer) {
        clearTimeout(activeSoundStopTimer);
        activeSoundStopTimer = null;
      }
    }

    // Plays terrifying horror shrieks, sub-bass booms, and static for a full 60 seconds
    function playMaxHorrorSound() {
      if (!audioCtx || audioCtx.state !== 'running') return;
      stopCurrentHorrorSound();

      const now = audioCtx.currentTime;
      const duration = HORROR_DURATION_SEC;

      const shaper = audioCtx.createWaveShaper();
      shaper.curve = makeDistortionCurve(160);
      shaper.oversample = '4x';

      const compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.setValueAtTime(-3, now);
      compressor.knee.setValueAtTime(6, now);
      compressor.ratio.setValueAtTime(16, now);
      compressor.attack.setValueAtTime(0.001, now);
      compressor.release.setValueAtTime(0.2, now);

      const boostGain = audioCtx.createGain();
      boostGain.gain.setValueAtTime(1.85, now);

      const masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(1.0, now);
      masterGain.gain.setValueAtTime(1.0, now + duration - 0.3);
      masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      boostGain.connect(shaper);
      shaper.connect(compressor);
      compressor.connect(masterGain);
      masterGain.connect(audioCtx.destination);

      const lfo = audioCtx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.setValueAtTime(25, now);

      const lfoGain = audioCtx.createGain();
      lfoGain.gain.setValueAtTime(170, now);
      lfo.connect(lfoGain);

      const shriekA = audioCtx.createOscillator();
      shriekA.type = 'sawtooth';

      const shriekB = audioCtx.createOscillator();
      shriekB.type = 'square';

      const shriekGain = audioCtx.createGain();

      const subOsc = audioCtx.createOscillator();
      subOsc.type = 'sawtooth';

      const subFilter = audioCtx.createBiquadFilter();
      subFilter.type = 'lowpass';
      subFilter.frequency.setValueAtTime(220, now);

      const subGain = audioCtx.createGain();

      // 30 horror bursts * 2 seconds = full 60 seconds
      for (let step = 0; step < 30; step++) {
        const tStart = now + step * 2.0;
        const tMid = tStart + 0.6;
        const tEnd = tStart + 1.96;

        const highA = step % 2 === 0 ? 2050 : 2420;
        const lowA = step % 2 === 0 ? 450 : 310;
        const highB = step % 2 === 0 ? 2550 : 1890;
        const lowB = step % 2 === 0 ? 280 : 520;

        shriekA.frequency.setValueAtTime(720, tStart);
        shriekA.frequency.exponentialRampToValueAtTime(highA, tMid);
        shriekA.frequency.exponentialRampToValueAtTime(lowA, tEnd);

        shriekB.frequency.setValueAtTime(1120, tStart);
        shriekB.frequency.exponentialRampToValueAtTime(highB, tMid);
        shriekB.frequency.exponentialRampToValueAtTime(lowB, tEnd);

        shriekGain.gain.setValueAtTime(0.98, tStart);
        shriekGain.gain.setValueAtTime(0.9, tStart + 1.45);
        shriekGain.gain.exponentialRampToValueAtTime(0.22, tEnd);

        subOsc.frequency.setValueAtTime(145, tStart);
        subOsc.frequency.exponentialRampToValueAtTime(32, tStart + 1.25);

        subGain.gain.setValueAtTime(1.0, tStart);
        subGain.gain.exponentialRampToValueAtTime(0.2, tEnd);
      }

      lfoGain.connect(shriekA.frequency);
      lfoGain.connect(shriekB.frequency);

      shriekA.connect(shriekGain);
      shriekB.connect(shriekGain);
      shriekGain.connect(boostGain);

      subOsc.connect(subFilter);
      subFilter.connect(subGain);
      subGain.connect(boostGain);

      const bufferSize = Math.floor(audioCtx.sampleRate * duration);
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;

      const bandpass = audioCtx.createBiquadFilter();
      bandpass.type = 'bandpass';
      bandpass.frequency.setValueAtTime(2050, now);
      bandpass.Q.setValueAtTime(3.2, now);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.95, now);
      noiseGain.gain.setValueAtTime(0.9, now + duration - 0.4);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + duration);

      whiteNoise.connect(bandpass);
      bandpass.connect(noiseGain);
      noiseGain.connect(boostGain);

      lfo.start(now);
      shriekA.start(now);
      shriekB.start(now);
      subOsc.start(now);
      whiteNoise.start(now);

      lfo.stop(now + duration);
      shriekA.stop(now + duration);
      shriekB.stop(now + duration);
      subOsc.stop(now + duration);
      whiteNoise.stop(now + duration);

      activeSoundStopTimer = setTimeout(() => {
        activeSoundStopTimer = null;
      }, HORROR_DURATION_MS);
    }

    function ensureAudioContextAndPlay() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }

      const onRunning = () => {
        audioUnlocked = true;
        pendingHorrorSound = false;
        playMaxHorrorSound();
      };

      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(onRunning).catch(() => {
          pendingHorrorSound = true;
        });
      } else {
        onRunning();
      }
    }

    function triggerHorrorEvent(t) {
      horrorFlashUntil = t + HORROR_DURATION_MS;
      triggerHorrorVibration();
      if (audioUnlocked && audioCtx && audioCtx.state === 'running') {
        playMaxHorrorSound();
      } else {
        pendingHorrorSound = true;
        ensureAudioContextAndPlay();
      }
    }

    // Clicking "click here" button always triggers 1-minute ghost, blood, and horror sound
    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerHorrorEvent(performance.now());
    });

    // Tapping/clicking anywhere on the screen triggers 1-minute ghost, blood, and horror sound
    canvas.addEventListener('pointerdown', () => {
      triggerHorrorEvent(performance.now());
    }, { passive: true });

    const darkMotionSpecks = Array.from({ length: 45 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vy: Math.random() * 0.8 + 0.35,
      size: Math.random() * 1.3 + 0.4,
      alpha: Math.random() * 0.08 + 0.02
    }));

    function drawPureDarkness() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      darkMotionSpecks.forEach((s) => {
        s.y += s.vy;
        if (s.y > height) {
          s.y = 0;
          s.x = Math.random() * width;
        }
        ctx.fillStyle = `rgba(180, 190, 210, ${s.alpha})`;
        ctx.fillRect(s.x, s.y, s.size, s.size * 2.2);
      });
    }

    function drawRealisticBlackPenguinFromBack(time) {
      const centerX = width * 0.5;
      const groundY = height * 0.74;

      const stepPhase = time * 0.0042;
      const waddleAngle = Math.sin(stepPhase) * 0.055;
      const bodyBounce = Math.abs(Math.sin(stepPhase)) * 5.5;

      const leftStep = Math.sin(stepPhase);
      const rightStep = -Math.sin(stepPhase);

      const scale = Math.max(0.75, Math.min(width, height) / 760);
      const bodyW = 94 * scale;
      const bodyH = 166 * scale;

      const groundShadow = ctx.createRadialGradient(
        centerX, groundY + 4, 2,
        centerX, groundY + 4, bodyW * 0.85
      );
      groundShadow.addColorStop(0, 'rgba(25, 28, 36, 0.35)');
      groundShadow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = groundShadow;
      ctx.beginPath();
      ctx.ellipse(centerX, groundY + 4, bodyW * 0.8, 14 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      function drawSmallFoot(offsetX, stepVal) {
        const lift = Math.max(0, stepVal) * 6.5;
        const forwardShift = stepVal * 4.5;
        const footY = groundY - lift - forwardShift * 0.35;
        const footScale = 1 - forwardShift * 0.014;

        ctx.save();
        ctx.translate(centerX + offsetX, footY);
        ctx.scale(footScale, footScale);

        const footGrad = ctx.createLinearGradient(0, -10 * scale, 0, 4 * scale);
        footGrad.addColorStop(0, '#07080a');
        footGrad.addColorStop(0.5, '#030304');
        footGrad.addColorStop(1, '#000000');

        ctx.fillStyle = footGrad;
        ctx.strokeStyle = 'rgba(190, 200, 218, 0.32)';
        ctx.lineWidth = 0.9;

        ctx.beginPath();
        ctx.moveTo(-10 * scale, 2);
        ctx.quadraticCurveTo(-12.5 * scale, -7 * scale, -5.5 * scale, -9.5 * scale);
        ctx.quadraticCurveTo(0, -11 * scale, 5.5 * scale, -9.5 * scale);
        ctx.quadraticCurveTo(12.5 * scale, -7 * scale, 10 * scale, 2);
        ctx.quadraticCurveTo(0, 4.5 * scale, -10 * scale, 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.lineWidth = 1 * scale;
        ctx.beginPath();
        ctx.moveTo(-3.5 * scale, -8.5 * scale);
        ctx.lineTo(-3 * scale, -2 * scale);
        ctx.moveTo(3.5 * scale, -8.5 * scale);
        ctx.lineTo(3 * scale, -2 * scale);
        ctx.stroke();

        ctx.restore();
      }

      drawSmallFoot(-bodyW * 0.24, leftStep);
      drawSmallFoot(bodyW * 0.24, rightStep);

      ctx.save();
      ctx.translate(centerX, groundY - bodyBounce);
      ctx.rotate(waddleAngle);

      const leftWingAngle = -0.16 + Math.sin(stepPhase) * 0.07;
      const rightWingAngle = 0.16 + Math.sin(stepPhase) * 0.07;

      ctx.save();
      ctx.translate(-bodyW * 0.45, -bodyH * 0.56);
      ctx.rotate(leftWingAngle);
      const lWingGrad = ctx.createLinearGradient(-14 * scale, 0, 6 * scale, 0);
      lWingGrad.addColorStop(0, '#07080b');
      lWingGrad.addColorStop(0.4, '#020203');
      lWingGrad.addColorStop(1, '#000000');
      ctx.fillStyle = lWingGrad;
      ctx.strokeStyle = 'rgba(185, 195, 215, 0.28)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(-6 * scale, 26 * scale, 8.5 * scale, 34 * scale, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.translate(bodyW * 0.45, -bodyH * 0.56);
      ctx.rotate(rightWingAngle);
      const rWingGrad = ctx.createLinearGradient(-6 * scale, 0, 14 * scale, 0);
      rWingGrad.addColorStop(0, '#000000');
      rWingGrad.addColorStop(0.6, '#020203');
      rWingGrad.addColorStop(1, '#07080b');
      ctx.fillStyle = rWingGrad;
      ctx.strokeStyle = 'rgba(185, 195, 215, 0.28)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(6 * scale, 26 * scale, 8.5 * scale, 34 * scale, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      const bodyGrad = ctx.createRadialGradient(
        0, -bodyH * 0.45, bodyW * 0.08,
        0, -bodyH * 0.42, bodyW * 0.62
      );
      bodyGrad.addColorStop(0, '#030305');
      bodyGrad.addColorStop(0.55, '#010102');
      bodyGrad.addColorStop(0.88, '#040507');
      bodyGrad.addColorStop(1, '#08090d');

      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.moveTo(-bodyW * 0.36, -bodyH * 0.78);
      ctx.quadraticCurveTo(0, -bodyH * 0.86, bodyW * 0.36, -bodyH * 0.78);
      ctx.bezierCurveTo(bodyW * 0.44, -bodyH * 0.68, bodyW * 0.54, -bodyH * 0.42, bodyW * 0.51, -bodyH * 0.12);
      ctx.bezierCurveTo(bodyW * 0.49, -bodyH * 0.02, bodyW * 0.38, 2, bodyW * 0.28, 0);
      ctx.quadraticCurveTo(0, 5 * scale, -bodyW * 0.28, 0);
      ctx.bezierCurveTo(-bodyW * 0.38, 2, -bodyW * 0.49, -bodyH * 0.02, -bodyW * 0.51, -bodyH * 0.12);
      ctx.bezierCurveTo(-bodyW * 0.54, -bodyH * 0.42, -bodyW * 0.44, -bodyH * 0.68, -bodyW * 0.36, -bodyH * 0.78);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(205, 215, 235, 0.34)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      const spineShade = ctx.createLinearGradient(0, -bodyH * 0.72, 0, -10 * scale);
      spineShade.addColorStop(0, 'rgba(0, 0, 0, 0)');
      spineShade.addColorStop(0.5, 'rgba(0, 0, 0, 0.55)');
      spineShade.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.strokeStyle = spineShade;
      ctx.lineWidth = 5 * scale;
      ctx.beginPath();
      ctx.moveTo(0, -bodyH * 0.70);
      ctx.lineTo(0, -12 * scale);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
      ctx.lineWidth = 0.8;
      for (let row = 0; row < 7; row++) {
        const fy = -bodyH * (0.22 + row * 0.075);
        const span = bodyW * (0.26 - Math.abs(row - 3) * 0.02);
        ctx.beginPath();
        ctx.moveTo(-span, fy);
        ctx.quadraticCurveTo(0, fy + 4 * scale, span, fy);
        ctx.stroke();
      }

      const crownBaseY = -bodyH * 0.77;
      const crownW = bodyW * 0.40;
      const crownH = bodyH * 0.31;

      const goldGrad = ctx.createLinearGradient(-crownW, crownBaseY, crownW, crownBaseY);
      goldGrad.addColorStop(0, '#8c6208');
      goldGrad.addColorStop(0.22, '#ffd700');
      goldGrad.addColorStop(0.5, '#d4af37');
      goldGrad.addColorStop(0.78, '#ffdf4d');
      goldGrad.addColorStop(1, '#7a5206');

      ctx.fillStyle = goldGrad;
      ctx.strokeStyle = '#fff2a6';
      ctx.lineWidth = 1.3;

      ctx.beginPath();
      ctx.moveTo(-crownW, crownBaseY);
      ctx.lineTo(-crownW * 0.85, crownBaseY - crownH * 0.72);
      ctx.lineTo(-crownW * 0.42, crownBaseY - crownH * 0.36);
      ctx.lineTo(0, crownBaseY - crownH);
      ctx.lineTo(crownW * 0.42, crownBaseY - crownH * 0.36);
      ctx.lineTo(crownW * 0.85, crownBaseY - crownH * 0.72);
      ctx.lineTo(crownW, crownBaseY);
      ctx.quadraticCurveTo(0, crownBaseY + 4 * scale, -crownW, crownBaseY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#b88b1e';
      ctx.beginPath();
      ctx.moveTo(-crownW, crownBaseY - 4 * scale);
      ctx.quadraticCurveTo(0, crownBaseY, crownW, crownBaseY - 4 * scale);
      ctx.lineTo(crownW, crownBaseY);
      ctx.quadraticCurveTo(0, crownBaseY + 4 * scale, -crownW, crownBaseY);
      ctx.closePath();
      ctx.fill();

      function drawRedGem(gx, gy, gw, gh) {
        ctx.save();
        ctx.translate(gx, gy);

        const gemGlow = ctx.createRadialGradient(0, 0, 1, 0, 0, gh * 1.4);
        gemGlow.addColorStop(0, 'rgba(255, 45, 75, 0.55)');
        gemGlow.addColorStop(1, 'rgba(150, 0, 20, 0)');
        ctx.fillStyle = gemGlow;
        ctx.beginPath();
        ctx.arc(0, 0, gh * 1.4, 0, Math.PI * 2);
        ctx.fill();

        const gemGrad = ctx.createLinearGradient(-gw, -gh, gw, gh);
        gemGrad.addColorStop(0, '#ff758f');
        gemGrad.addColorStop(0.45, '#e11d48');
        gemGrad.addColorStop(1, '#4c0519');

        ctx.fillStyle = gemGrad;
        ctx.strokeStyle = '#ffe4e6';
        ctx.lineWidth = 0.9;

        ctx.beginPath();
        ctx.moveTo(0, -gh);
        ctx.lineTo(gw, 0);
        ctx.lineTo(0, gh);
        ctx.lineTo(-gw, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(-gw * 0.25, -gh * 0.25, 1.2 * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      drawRedGem(0, crownBaseY - crownH * 0.28, 6 * scale, 9 * scale);
      drawRedGem(-crownW * 0.56, crownBaseY - crownH * 0.22, 4.2 * scale, 6 * scale);
      drawRedGem(crownW * 0.56, crownBaseY - crownH * 0.22, 4.2 * scale, 6 * scale);

      ctx.restore();
    }

    function drawFullTimeCounter(now) {
      const year = now.getFullYear();

      const startOfYear = new Date(year, 0, 1);
      const diffMs = now - startOfYear;
      const dayOfYear = Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1;

      const dayNames = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      const dayName = dayNames[now.getDay()];

      const hours = pad2(now.getHours());
      const minutes = pad2(now.getMinutes());
      const seconds = pad2(now.getSeconds());

      const cx = width * 0.5;
      const topY = Math.max(72, height * 0.12);

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const mainFontSize = Math.min(34, Math.max(22, width * 0.065));
      ctx.font = `300 ${mainFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace`;
      ctx.fillStyle = 'rgba(240, 244, 252, 0.9)';
      ctx.fillText(`${hours} : ${minutes} : ${seconds}`, cx, topY);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - 88, topY + mainFontSize * 0.72);
      ctx.lineTo(cx + 88, topY + mainFontSize * 0.72);
      ctx.stroke();

      const subFontSize = Math.min(15, Math.max(12, width * 0.032));
      ctx.font = `400 ${subFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      ctx.fillStyle = 'rgba(195, 205, 225, 0.72)';
      ctx.fillText(`${dayName}  •  ${year}  •  ${String(dayOfYear).padStart(3, '0')}D`, cx, topY + mainFontSize * 1.32);

      ctx.restore();
    }

    const bloodDrips = Array.from({ length: 34 }, (_, i) => ({
      x: ((i + 0.5) / 34) * width,
      len: 35 + (i % 5) * 24,
      speed: 0.7 + (i % 4) * 0.35,
      w: 4 + (i % 3) * 3
    }));

    function drawBloodFrame(intensity, t) {
      ctx.save();

      const pulse = 0.85 + 0.15 * Math.sin(t * 0.016);

      const edgeGrad = ctx.createRadialGradient(
        width * 0.5, height * 0.5, Math.min(width, height) * 0.25,
        width * 0.5, height * 0.5, Math.max(width, height) * 0.72
      );
      edgeGrad.addColorStop(0, 'rgba(120, 0, 0, 0)');
      edgeGrad.addColorStop(0.7, `rgba(155, 0, 10, ${0.42 * intensity * pulse})`);
      edgeGrad.addColorStop(1, `rgba(105, 0, 0, ${0.92 * intensity * pulse})`);

      ctx.fillStyle = edgeGrad;
      ctx.fillRect(0, 0, width, height);

      const borderSize = Math.max(18, Math.min(width, height) * 0.048) * intensity;
      ctx.fillStyle = `rgba(135, 0, 8, ${0.92 * intensity})`;
      ctx.fillRect(0, 0, width, borderSize);
      ctx.fillRect(0, height - borderSize, width, borderSize);
      ctx.fillRect(0, 0, borderSize, height);
      ctx.fillRect(width - borderSize, 0, borderSize, height);

      bloodDrips.forEach((drip, idx) => {
        const dx = (drip.x / Math.max(1, width)) * width;
        const dripLen = (drip.len + Math.sin(t * 0.012 + idx) * 18) * intensity;

        const dripGrad = ctx.createLinearGradient(0, borderSize, 0, borderSize + dripLen);
        dripGrad.addColorStop(0, `rgba(165, 0, 12, ${0.96 * intensity})`);
        dripGrad.addColorStop(0.75, `rgba(115, 0, 8, ${0.85 * intensity})`);
        dripGrad.addColorStop(1, 'rgba(90, 0, 5, 0)');

        ctx.fillStyle = dripGrad;
        ctx.beginPath();
        ctx.roundRect(dx - drip.w * 0.5, borderSize - 2, drip.w, dripLen, drip.w * 0.5);
        ctx.fill();
      });

      ctx.restore();
    }

    function drawUglyHorrorGhost(intensity, t) {
      ctx.save();

      ctx.fillStyle = `rgba(14, 0, 2, ${0.74 * intensity})`;
      ctx.fillRect(0, 0, width, height);

      // Continuous violent movement & shaking throughout the full minute
      const shakeX = Math.sin(t * 0.095) * 14 * intensity + Math.cos(t * 0.031) * 26 * intensity;
      const shakeY = Math.cos(t * 0.115) * 11 * intensity + Math.sin(t * 0.024) * 18 * intensity;
      const tiltAngle = Math.sin(t * 0.022) * 0.09 * intensity;
      const cx = width * 0.5 + shakeX;
      const cy = height * 0.52 + shakeY;

      const ghostScale = (Math.max(0.85, Math.min(width, height) / 420)) * (0.94 + 0.1 * Math.sin(t * 0.018)) * intensity;

      ctx.translate(cx, cy);
      ctx.rotate(tiltAngle);
      ctx.scale(ghostScale, ghostScale);

      const shroudGrad = ctx.createLinearGradient(0, -170, 0, 190);
      shroudGrad.addColorStop(0, `rgba(225, 220, 220, ${0.95 * intensity})`);
      shroudGrad.addColorStop(0.55, `rgba(155, 145, 145, ${0.9 * intensity})`);
      shroudGrad.addColorStop(1, `rgba(65, 5, 10, ${0.28 * intensity})`);

      ctx.fillStyle = shroudGrad;
      ctx.strokeStyle = `rgba(180, 0, 15, ${0.9 * intensity})`;
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(-115, 15);
      ctx.bezierCurveTo(-125, -135, -75, -175, 0, -175);
      ctx.bezierCurveTo(75, -175, 125, -135, 115, 15);

      const teeth = 9;
      for (let i = teeth; i >= 0; i--) {
        const tx = -115 + (230 / teeth) * i;
        const ty = 15 + (i % 2 === 0 ? 155 : 95) + Math.sin(t * 0.02 + i) * 14;
        ctx.lineTo(tx, ty);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      const eyePositions = [-44, 44];
      eyePositions.forEach((ex, idx) => {
        const ey = -58 + (idx === 1 ? -5 : 4) + Math.sin(t * 0.03 + idx) * 2.5;
        ctx.fillStyle = '#080001';
        ctx.beginPath();
        ctx.ellipse(ex, ey, 26, 33, idx === 0 ? -0.22 : 0.22, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = `rgba(210, 10, 25, ${0.92 * intensity})`;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = '#ff001e';
        ctx.beginPath();
        ctx.arc(ex + Math.sin(t * 0.05) * 4.5, ey + Math.cos(t * 0.04) * 3, 7.5, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = '#090001';
      ctx.strokeStyle = `rgba(155, 0, 12, ${0.95 * intensity})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-48, 12);
      ctx.quadraticCurveTo(-20, -12, 0, 8);
      ctx.quadraticCurveTo(24, -18, 52, 16);
      ctx.quadraticCurveTo(28, 68, 0, 74);
      ctx.quadraticCurveTo(-32, 66, -48, 12);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#d8cfcf';
      const mouthTeeth = [-32, -16, 0, 16, 32];
      mouthTeeth.forEach((mx, i) => {
        const topY = i % 2 === 0 ? 8 : 12;
        ctx.beginPath();
        ctx.moveTo(mx - 5, topY);
        ctx.lineTo(mx, topY + 15);
        ctx.lineTo(mx + 5, topY);
        ctx.closePath();
        ctx.fill();
      });

      ctx.restore();
    }

    function animate(time) {
      const t = typeof time === 'number' ? time : performance.now();
      const now = new Date();

      // Ghost appears 5 seconds after entering the site
      if (!entryGhostTriggered && t - pageEnterTime >= 5000) {
        entryGhostTriggered = true;
        triggerHorrorEvent(t);
      }

      drawPureDarkness();
      drawRealisticBlackPenguinFromBack(t);
      drawFullTimeCounter(now);

      const remainingMs = horrorFlashUntil - t;
      if (remainingMs > 0) {
        const intensity = Math.min(1, remainingMs / 1000);
        drawBloodFrame(intensity, t);
        drawUglyHorrorGhost(intensity, t);
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
